name: CI

on:
  push:
    branches: [main] # tags are covered by release.yml, which tests before publishing
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Seamline.slnx --configuration Release
      - name: Test
        run: dotnet test Seamline.slnx --configuration Release --no-build
      # Same publish + smoke test as release.yml, so a packaging break shows up
      # on the PR instead of in a shipped release.
      - name: Publish
        run: dotnet publish src/App/Seamline.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Smoke-test the published exe
        shell: pwsh
        run: |
          # The release ships seamline.exe ALONE, so test it alone: copied out of
          # publish/, where leftover side-by-side files would mask a missing one.
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'smoke')
          Copy-Item publish/seamline.exe $dir
          $p = Start-Process (Join-Path $dir 'seamline.exe') -ArgumentList '--smoketest' -PassThru
          $null = $p.Handle # cache the handle, or ExitCode stays empty after exit
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Smoke test timed out.' }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)." }
